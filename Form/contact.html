<!-- Lorelei Hutson 11/12/2026 contact html-->
 <!DOCTYPE html>
 <html lang="en">
    <head>
         <meta charset="UTF-8">
         <meta name="viewport" content="width=device-width, initial-scale=1.0">
         <title>Contact Us</title>
         <link rel="stylesheet" href="styles.css">
    </head>

 <body>
        <div class="container">
    <header>
        <img src="logo.jpg" alt="JCCC logo">
        <h2>Contact Us</h2>
        <p>Please fill out your information below</p>
    </header>
    

<main>
   
    <form action="https://webdevbasics.net/scripts/demo.php" method="post">
      
      <div class="form-group">
        <label for="fname">First Name:</label>
        <input type="text" id="fname" maxlength="30" name="fname" required>    
      </div>

      <div class="form-group">
         <label for="lname">Last Name:</label>
         <input type="text" id="lname" maxlength="30" name="lname" required>
      </div>

      <div class="form-group">
         <label for="email">Email:</label>
         <input type="email" id="email" name="email" required>
      </div>

      <div class="form-group">
         <label for="phone">Phone:</label>
         <input type="tel" id="phone" placeholder="123-456-7890" name="phone" required>      
      </div>

      <!--Radio group-->   
        <div class="contact-options">
            <label>How would you prefer we contact you?</label>
        </div>    

        <div class="radio-option">
            <input type="radio" id="contactEmail" name="contactPreference" value="Email" required>
            <label for="contactEmail">Email</label>
        </div>
        
        <div class="radio-option">
            <input type="radio" id="contactText" name="contactPreference" value="Text" required>
            <label for="contactText">Text</label>
        </div>

         <div class="radio-option">
            <input type="radio" id="contactNoPreference" name="contactPreference" value="No Preference" required>
            <label for="contactNoPreference">No Preference</label>
        </div>
  
         
         <button type="submit">Submit</button>
  </form>
</main>
      <footer>
        <p>&copy; 2026 Lorelei Hutson </p>
      </footer>
    
    </div>
   
    
 </body> 


 </html>
